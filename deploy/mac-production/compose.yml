services:
  app:
    image: ${PA_IMAGE:?Set PA_IMAGE to the versioned production image}
    restart: unless-stopped
    env_file:
      - ${PA_RUNTIME_ROOT:?Set PA_RUNTIME_ROOT}/secrets/server.env
    environment:
      WEB_DIST: /app/web-dist
    volumes:
      - app-data:/data
    ports:
      - 127.0.0.1:13020:8787
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 384
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  app-data:
    external: true
    name: personal-assistant-mac_app-data
